# Documentation as a website: https://kontext.email/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml publishes it).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
# German only. The English pages that were under /en/ redirect to the German ones (redirects below).
site_name: Kontext
site_description: >-
  Mail, Kalender, Kontakte, Aufgaben, Team-Chat und Telefonie (CTI) auf dem eigenen Server – die
  selbst gehostete Alternative zu Google Workspace und Microsoft 365, mit Stalwart als Mailserver.
site_author: Tristan Teufel
site_url: https://kontext.email/
repo_url: https://github.com/Speicherstadt/kontext
repo_name: Speicherstadt/kontext
edit_uri: edit/main/docs/
# HTML: the legal notice and the privacy policy in the footer of every page
copyright: >-
  Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende ·
  <a href="https://teufel-it.de/de/impressum/">Impressum</a> ·
  <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>
# Pages as mail.html instead of mail/: keeps the relative image paths right, which also have to
# work on GitHub
use_directory_urls: false
# Links to headings that don't exist fail the strict build
validation:
  anchors: warn
theme:
  name: material
  # Search engines and link previews (overrides/main.html)
  custom_dir: overrides
  language: de
  # The app's icon (public/favicon.svg)
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: { icon: material/weather-night, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: { icon: material/weather-sunny, name: Hell }
plugins:
  - search
  # No requests to Google Fonts or CDNs from the reader's browser: the fonts and Mermaid are
  # downloaded at build time and served from the site (cache in .cache/). The Schreibzeug
  # screenshots stay on schreibzeug.app, GitHub Pages like this site: the plugin can't fetch
  # images with #only-light/#only-dark (it asks for the URL with the fragment, a 404)
  - privacy:
      assets_exclude:
        - schreibzeug.app/*
  # The English pages that were under /en/ until the docs became German only: links shared
  # before keep working and land on the German page
  - redirects:
      redirect_maps:
        en/accessibility.md: accessibility.md
        en/agents.md: agents.md
        en/app.md: app.md
        en/architecture.md: architecture.md
        en/calendar-contacts.md: calendar-contacts.md
        en/chat.md: chat.md
        en/company.md: company.md
        en/development.md: development.md
        en/documents.md: documents.md
        en/encryption.md: encryption.md
        en/entdecken.md: index.md
        en/hosted.md: hosted.md
        en/index.md: index.md
        en/installation.md: installation.md
        en/mail.md: mail.md
        en/tasks.md: tasks.md
        en/telephony.md: telephony.md
        en/ueberblick.md: ueberblick.md
        en/vps.md: vps.md
  # "Letztes Update" under every page, from the last commit of its file (the docs workflow checks
  # out the whole history for it)
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
extra_css:
  - assets/entdecken.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Speicherstadt/kontext
      name: Quellcode auf GitHub
nav:
  - Start: index.md
  - Überblick: ueberblick.md
  - Funktionen:
      - Mail: mail.md
      - Kalender und Kontakte: calendar-contacts.md
      - Aufgaben: tasks.md
      - Team-Chat und Videocalls: chat.md
      - Telefonie (CTI): telephony.md
      - Dokumente: documents.md
      - Verschlüsselung: encryption.md
      - KI-Agenten (MCP): agents.md
      - Firmenverwaltung und Umzug: company.md
      - App, Handy und Konto: app.md
      - Barrierefreiheit: accessibility.md
  - Betrieb:
      - VPS einrichten: vps.md
      - Installation: installation.md
      - Gehostet oder mit Partner: hosted.md
  - Technik:
      - Architektur: architecture.md
      - Entwicklung: development.md
